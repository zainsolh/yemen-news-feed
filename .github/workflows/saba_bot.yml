name: Yemen News Feed Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */1 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Install dependencies
        run: |
          pip install cloudscraper beautifulsoup4 lxml google-auth google-auth-oauthlib google-auth-httplib2 requests
     
        

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

    
         
      - name: Run Python Script
        env:
          BLOG_ID: ${{ secrets.BLOG_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: python fetch_news.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "Saba News Bot"
          git config --global user.email "bot@github.com"
          git add published_urls.txt || true
          git commit -m "Update published news log"
          git push || true

